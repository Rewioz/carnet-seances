<style>html{color-scheme:light dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet de séances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: one phone-width column. Week strip on top picks the day; the day's checklist sits below, then the daily log, then the trend charts.
     Weight-plate colours mark the session type: blue = back, red = chest, green = legs, grey = rest. */
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#141A23; --muted:#556070; --line:#D3D9E0; --soft:#E3E8EE;
  --blue:#1F5FBF; --red:#C0352B; --green:#1B7F47; --grey:#6B7686; --on:#FFFFFF;
  --series:#2A78D6; --grid:#E4E8ED; --axis:#C3CAD3;
  --f-head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#18202A; --ink:#E9EDF2; --muted:#9BA6B5; --line:#2A3441; --soft:#222B37;
    --blue:#6AA5FF; --red:#FF7A6E; --green:#52C98B; --grey:#8F9AAB; --on:#0B1016;
    --series:#3987E5; --grid:#262F3B; --axis:#3A4655; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#18202A; --ink:#E9EDF2; --muted:#9BA6B5; --line:#2A3441; --soft:#222B37;
  --blue:#6AA5FF; --red:#FF7A6E; --green:#52C98B; --grey:#8F9AAB; --on:#0B1016;
  --series:#3987E5; --grid:#262F3B; --axis:#3A4655; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.4;
  padding-block:12px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 30px/1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;margin:0}
.save{font-size:13px;color:var(--muted);text-align:right;min-height:18px}
.save.warn{color:var(--red);font-weight:600}

.weeknav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px}
.weeknav button{height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:24px;line-height:1;cursor:pointer}
.weeknav button:disabled{opacity:.35;cursor:default}
.wlabel{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.wlabel strong{font:700 22px/1.1 var(--f-head);letter-spacing:.02em;text-transform:uppercase}
.wlabel span{font-size:13px;color:var(--muted)}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tab{
  border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 9px;min-height:74px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.tab[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.tab .l{font:700 22px/1 var(--f-head)}
.tab[aria-pressed="true"] .l{color:var(--c)}
.tab .n{font-size:12px;color:var(--muted);padding:0 6px;border-radius:8px;line-height:1.5}
.tab .n.today{background:var(--ink);color:var(--bg);font-weight:600}
.mkw{height:14px;display:flex;align-items:center}
.mk{width:14px;height:14px;border-radius:50%;border:2px solid var(--c)}
.mk.done{background:var(--c)}
.mk.part{background:color-mix(in srgb,var(--c) 40%,transparent)}
.mk.rest{height:3px;border:0;border-radius:2px;background:var(--grey)}

.summary{margin:0;font-size:14px;color:var(--muted)}
.summary strong{color:var(--ink);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.dayhead{display:flex;flex-direction:column;gap:10px}
.eyebrow{margin:0 0 2px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
h2{margin:0;font:700 32px/1.05 var(--f-head);color:var(--c);text-wrap:balance;letter-spacing:.01em}
.prog{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.pfill{height:100%;border-radius:999px;background:var(--c)}
.pcount{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:14px;color:var(--muted)}

.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.name{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0;font-size:18px;font-weight:600;line-height:1.2}
.meta{margin:0;font-size:13px;color:var(--muted)}
.row.done .meta::after{content:" · terminé";color:var(--c);font-weight:600}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.sets{display:flex;gap:10px}
.set{
  width:54px;height:54px;border-radius:50%;border:2px solid var(--c);background:transparent;color:var(--c);
  font:700 24px/1 var(--f-head);cursor:pointer;display:grid;place-items:center;padding:0;
}
.set[aria-pressed="true"]{background:var(--c);color:var(--on)}
.set:active{transform:scale(.94)}
.kgwrap{display:flex;align-items:center;gap:6px;color:var(--muted)}
.kgin{width:84px;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.kgin::placeholder{color:var(--muted);opacity:.7;font-weight:400}
.last{margin:0;font-size:12px;color:var(--muted)}

.check{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:62px;
}
.check .box{width:30px;height:30px;border-radius:8px;border:2px solid var(--c);flex:none;position:relative}
.check[aria-pressed="true"] .box{background:var(--c)}
.check[aria-pressed="true"] .box::after{content:"";position:absolute;left:9px;top:3px;width:7px;height:14px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg)}
.check strong{display:block;font-weight:600}
.check small{color:var(--muted);font-size:13px}
.restmsg{margin:0;padding:14px;background:var(--bg);border-radius:12px;color:var(--muted)}

.sub{margin:0;font:700 21px/1.1 var(--f-head);letter-spacing:.02em;text-transform:uppercase}
.bw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bw label{font-weight:500}
.water{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.wtop{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.wl{font-weight:500;margin-right:10px}
.wv{font:700 28px/1 var(--f-head);letter-spacing:.01em}
.wg{font-size:13px;color:var(--muted)}
.wm{position:relative;height:10px;border-radius:999px;background:var(--soft)}
.wf{height:100%;border-radius:999px;background:var(--blue)}
.wf.ok{background:var(--green)}
.wt{position:absolute;top:-3px;bottom:-3px;left:71.43%;width:2px;background:var(--ink);opacity:.5}
.wsc{position:relative;height:14px;font-size:11px;color:var(--muted)}
.wsc span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.wb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wb button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600;cursor:pointer}
.wb button:active{background:var(--soft)}

.evo{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.evoh{margin:0;font:700 26px/1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:0 1 240px;min-width:0}
.seg button{min-height:44px;background:transparent;border:0;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.exsel{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0;color:var(--muted);font-size:14px}
.exsel select{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px;font-size:15px;color:var(--ink)}
.charts{display:flex;flex-direction:column;gap:12px}
.viz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.vh h3{margin:0;font:700 21px/1.1 var(--f-head);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.vh p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tgl{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.plot{position:relative;min-width:0}
.plot svg{display:block;max-width:100%;overflow:visible}
.ax{fill:var(--muted);font:11px var(--f-body)}
.g{stroke:var(--grid);stroke-width:1}
.g0{stroke:var(--axis);stroke-width:1}
.ln{fill:none;stroke:var(--series);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.hl{fill:none;stroke:var(--series);stroke-width:2;visibility:hidden}
.xh{stroke:var(--axis);stroke-width:1;visibility:hidden}
.bar{fill:var(--series)}
.bar.on{opacity:.8}
.val{fill:var(--ink);font:600 12px var(--f-body)}
.ov,.bh{fill:transparent;touch-action:pan-y}
.hit{fill:transparent;pointer-events:none;outline:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;z-index:2;display:flex;flex-direction:column;gap:1px}
.tip b{font-size:15px;font-weight:600}
.tip span{opacity:.8}
.empty,.hint{margin:0;font-size:14px;color:var(--muted)}
.tw{overflow-x:auto}
.tw table{width:100%;border-collapse:collapse;font-size:14px}
.tw th,.tw td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tw th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-top:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font:700 28px/1.05 var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b small{font-size:15px;font-weight:600}
.stat .s{font-size:12.5px;color:var(--muted);line-height:1.3}
@media (max-width:380px){.stats{grid-template-columns:1fr}}
.wk{width:100%;border-collapse:collapse;font-size:14.5px}
.wk th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:0 6px 8px}
.wk td{padding:10px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
.wk td small{display:block;color:var(--muted);font-size:12px}
.wk tr.cur td:first-child{font-weight:600}
.wk tr.cur td:first-child::after{content:"en cours";display:inline-block;margin-left:8px;font-size:11px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 6px;vertical-align:middle}
.wk tr.fut td{color:var(--muted)}
.segs{display:flex;gap:3px;margin-top:4px}
.segs i{width:12px;height:8px;border-radius:2px;background:var(--soft)}
.segs i.on{background:var(--series)}
.loads{list-style:none;margin:0;padding:0}
.loads li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.loads li:first-child{border-top:0;padding-top:0}
.loads .nm{font-weight:600;overflow-wrap:anywhere}
.loads .vv{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.loads .dd{grid-column:1/-1;font-size:13px;color:var(--muted)}
.dl{font-weight:600;white-space:nowrap}
.dl.up{color:var(--green)}.dl.down{color:var(--red)}
.foot{margin:0;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="cs-app" class="app"><p class="foot">Chargement du carnet…</p></div>

<script>
(function(){
'use strict';
var VERSION=12;

/* ---------- One live instance only ----------
   The viewer can run this script again in the same page after an update.
   Every instance takes a token; older instances go inert and lose their DOM. */
var INST=Date.now()+'-'+Math.random();
try{if(typeof window.__carnetStop==='function')window.__carnetStop();}catch(e){}
window.__carnetInst=INST;
function alive(){return window.__carnetInst===INST;}
var stops=[];
window.__carnetStop=function(){stops.forEach(function(f){try{f();}catch(e){}});stops=[];};

var holder=document.getElementById('cs-app');
if(!holder)return;
var root=holder.cloneNode(false);            /* fresh node: no listener from any earlier run survives */
holder.parentNode.replaceChild(root,holder);
var q=function(s){return root.querySelector(s);};

/* ---------- Plan ---------- */
var EX={
  'tirage-vertical':{n:'Tirage vertical',reps:'6–8',rest:'2 min 30'},
  'tirage-horizontal':{n:'Tirage horizontal',reps:'6–8',rest:'2 min 30'},
  'biceps-1':{n:'Biceps 1',reps:'6–8',rest:'2 min 30'},
  'biceps-2':{n:'Biceps 2',reps:'6–8',rest:'2 min 30'},
  'elev-lat':{n:'Élévations latérales',reps:'10–15',rest:'1 min 30'},
  'face-pull':{n:'Face pull',reps:'12–15',rest:'1 min 30'},
  'pecs-1':{n:'Pecs 1',reps:'6–8',rest:'2 min 30'},
  'pecs-2':{n:'Pecs 2',reps:'6–8',rest:'2 min 30'},
  'triceps-1':{n:'Triceps 1',reps:'6–8',rest:'2 min 30'},
  'triceps-2':{n:'Triceps 2',reps:'6–8',rest:'2 min 30'},
  'abdos-1':{n:'Abdos 1',reps:'10–15',rest:'1 min 30'},
  'abdos-2':{n:'Abdos 2',reps:'10–15',rest:'1 min 30'},
  'jambes-1':{n:'Jambes 1',reps:'6–8',rest:'2 min 30'},
  'jambes-2':{n:'Jambes 2',reps:'6–8',rest:'2 min 30'},
  'jambes-3':{n:'Jambes 3',reps:'6–8',rest:'2 min 30'},
  'jambes-4':{n:'Jambes 4',reps:'6–8',rest:'2 min 30'},
  'jambes-5':{n:'Jambes 5',reps:'6–8',rest:'2 min 30'},
  'lombaires':{n:'Lombaires',reps:'10–12',rest:'1 min 30'}
};
var PULL=['tirage-vertical','tirage-horizontal','biceps-1','biceps-2','elev-lat','face-pull'];
var PUSH=['pecs-1','pecs-2','triceps-1','triceps-2','abdos-1','abdos-2'];
var LEGS=['jambes-1','jambes-2','jambes-3','jambes-4','jambes-5','lombaires'];
var DAYS=[
  {k:'lun',l:'L',name:'Lundi',title:'Dos · Biceps · Épaules',c:'blue',ex:PULL,cardio:true},
  {k:'mar',l:'M',name:'Mardi',title:'Pecs · Triceps · Abdos',c:'red',ex:PUSH,cardio:true},
  {k:'mer',l:'M',name:'Mercredi',title:'Jambes',c:'green',ex:LEGS},
  {k:'jeu',l:'J',name:'Jeudi',title:'Repos',c:'grey',ex:[],rest:true},
  {k:'ven',l:'V',name:'Vendredi',title:'Dos · Biceps · Épaules',c:'blue',ex:PULL},
  {k:'sam',l:'S',name:'Samedi',title:'Pecs · Triceps · Abdos',c:'red',ex:PUSH},
  {k:'dim',l:'D',name:'Dimanche',title:'Jambes',c:'green',ex:LEGS,note:'Deuxième séance jambes de la semaine. Garde 1 ou 2 reps en réserve et ne cherche pas le maximum.'}
];
var SECTIONS=['checks','kg','bw','water'];
var W_MIN=2500,W_MAX=3500;

/* ---------- Helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function isoWeek(mon){
  var t=new Date(Date.UTC(mon.getFullYear(),mon.getMonth(),mon.getDate()+3));
  var y=t.getUTCFullYear(),j4=new Date(Date.UTC(y,0,4));
  return {y:y,wk:1+Math.round(((t-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7)};
}
function keyOf(mon){var w=isoWeek(mon);return w.y+'-W'+String(w.wk).padStart(2,'0');}
function mondayFromKey(k){
  var m=/^(\d{4})-W(\d{2})$/.exec(k),j4=new Date(+m[1],0,4);
  return addDays(addDays(j4,-((j4.getDay()+6)%7)),7*(+m[2]-1));
}
function fmtDate(d){return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function fmtNum(n){return String(Math.round(n*10)/10).replace('.',',');}
function fmtL(ml){return (ml/1000).toFixed(2).replace(/\.?0+$/,'').replace('.',',')+' L';}
function toNum(s){var n=parseFloat(String(s==null?'':s).replace(',','.'));return isFinite(n)&&n>0?n:null;}
function avg(o){var v=Object.keys(o||{}).map(function(k){return toNum(o[k]);}).filter(function(x){return x!==null;});return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;}
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function clone(v){return JSON.parse(JSON.stringify(v));}
function merge(a,b){                       /* deep merge, arrays and scalars replace */
  var o=isObj(a)?clone(a):{};
  if(isObj(b))Object.keys(b).forEach(function(k){o[k]=isObj(b[k])?merge(o[k],b[k]):clone(b[k]);});
  return o;
}
function stable(v){
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  if(isObj(v))return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+stable(v[k]);}).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function norm(d){var o={};SECTIONS.forEach(function(k){o[k]=(isObj(d)&&isObj(d[k]))?d[k]:{};});return o;}
function hasData(d){
  return Object.keys(d.checks).some(function(k){return (d.checks[k]||[]).some(Boolean);})||
    Object.keys(d.kg).some(function(k){return toNum(d.kg[k])!==null;})||
    Object.keys(d.bw).some(function(k){return toNum(d.bw[k])!==null;})||
    Object.keys(d.water).some(function(k){return +d.water[k]>0;});
}

/* ---------- State ---------- */
var NOW=new Date(),CUR=mondayOf(NOW),TODAY=(NOW.getDay()+6)%7;
var FIRST=new Date(2026,10,9);            /* the log starts the week of 9 Nov 2026 */
var LAST=new Date(2026,11,21);            /* last week: 21 to 27 Dec 2026 */
var NWEEKS=Math.round((LAST-FIRST)/6048e5)+1;
if(CUR<FIRST)CUR=FIRST;if(CUR>LAST)CUR=LAST;
var S={db:null,uid:null,local:true,ready:false,weekStart:CUR,key:keyOf(CUR),sel:TODAY,data:norm(null),names:{}};
var REMOTE={};        /* docId -> last doc the store gave us */
var PEND={};          /* docId -> changes not yet confirmed by the store */
var UI={range:8,ex:'tirage-vertical',table:{}};

/* ---------- Device storage (backup of unsent changes, and whole data when there is no account store) ---------- */
var LS='carnet8:',mem={};
function lsGet(k){try{var v=localStorage.getItem(LS+k);if(v)return JSON.parse(v);}catch(e){}return mem[k]===undefined?null:mem[k];}
function lsSet(k,v){mem[k]=v;try{localStorage.setItem(LS+k,JSON.stringify(v));}catch(e){}}
function lsDel(k){delete mem[k];try{localStorage.removeItem(LS+k);}catch(e){}}
function lsKeys(prefix){
  var out={};Object.keys(mem).forEach(function(k){if(k.indexOf(prefix)===0)out[k]=1;});
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(LS+prefix)===0)out[k.slice(LS.length)]=1;}}catch(e){}
  return Object.keys(out);
}
try{
  var u0=lsGet('ui');
  if(u0){if([0,8,12].indexOf(u0.range)>=0)UI.range=u0.range;if(u0.ex&&EX[u0.ex])UI.ex=u0.ex;}
}catch(e){}

/* ---------- Saving ----------
   Each change is a small patch. Patches are merged into the stored document, so two devices
   or a late load never wipe each other. A patch stays on the device until the store confirms it. */
function docRef(id){return S.db.collection('data/users/'+S.uid).doc(id);}
var chain=Promise.resolve(),timers={},failing=false;
function setStatus(t,warn){var el=q('#cs-save');if(el){el.textContent=t||'';el.classList.toggle('warn',!!warn);}}
function pendingCount(){return Object.keys(PEND).length;}
function change(id,patch){
  PEND[id]=merge(PEND[id],patch);lsSet('p:'+id,PEND[id]);
  setStatus('Enregistrement…');
  clearTimeout(timers[id]);timers[id]=setTimeout(function(){flush(id);},150);
}
function flush(id){clearTimeout(timers[id]);chain=chain.then(function(){return send(id);});return chain;}
function flushAll(){Object.keys(PEND).forEach(flush);return chain;}
async function send(id){
  if(!alive()||!S.ready||!PEND[id])return;
  var patch=clone(PEND[id]),sig=stable(patch);
  try{
    if(S.local){lsSet('d:'+id,merge(lsGet('d:'+id),patch));}
    else{
      var ref=docRef(id);
      try{await ref.update(patch);}
      catch(e1){
        var s=await ref.get();
        if(s.exists)throw e1;
        await ref.set(patch);
      }
    }
    REMOTE[id]=merge(REMOTE[id],patch);
    if(PEND[id]&&stable(PEND[id])===sig){delete PEND[id];lsDel('p:'+id);}
    failing=false;
    if(!pendingCount())setStatus('Enregistré');
    else if(PEND[id])flush(id);
  }catch(e){
    failing=true;
    setStatus('Pas encore enregistré, nouvel essai…',true);
    clearTimeout(timers[id]);timers[id]=setTimeout(function(){if(alive())flush(id);},3000);
  }
}
function wkId(key){return 'w-'+key;}
function weekData(key){return norm(merge(REMOTE[wkId(key)],PEND[wkId(key)]));}
function namesNow(){var p=merge(REMOTE.plan,PEND.plan);return isObj(p.names)?p.names:{};}
function exName(id){var n=S.names[id];return (typeof n==='string'&&n.trim())?n:EX[id].n;}

/* ---------- Derived ---------- */
function setsIn(d,day,id){var a=d.checks[day+'_'+id]||[];return [0,1,2].filter(function(i){return a[i]===true;}).length;}
function cardioIn(d,day){var a=d.checks[day+'_cardio']||[];return a[0]===true;}
function totalIn(d,day){var n=0;day.ex.forEach(function(id){n+=setsIn(d,day.k,id);});return n;}
function statusIn(d,i){
  var day=DAYS[i];if(day.rest)return 'rest';
  var n=totalIn(d,day);
  if(n===day.ex.length*3)return 'done';
  return (n>0||(day.cardio&&cardioIn(d,day.k)))?'part':'none';
}
var STATUS_LABEL={done:'séance faite',part:'en cours',rest:'repos',none:'à faire'};
function prevData(){return weekData(keyOf(addDays(S.weekStart,-7)));}

/* ---------- Skeleton ---------- */
root.innerHTML=
  '<header class="top"><h1>Carnet de séances</h1><span id="cs-save" class="save" role="status" aria-live="polite"></span></header>'+
  '<div class="weeknav"><button type="button" data-act="prev" id="cs-prev" aria-label="Semaine précédente">‹</button><div class="wlabel" id="cs-week"></div><button type="button" data-act="next" id="cs-next" aria-label="Semaine suivante">›</button></div>'+
  '<nav class="days" id="cs-days" aria-label="Jours de la semaine"></nav>'+
  '<p class="summary" id="cs-summary"></p>'+
  '<main id="cs-panel" style="display:flex;flex-direction:column;gap:14px"></main>'+
  '<section class="evo" aria-labelledby="cs-evoh"><h2 class="evoh" id="cs-evoh">Évolution</h2>'+
    '<p class="summary">Ton bilan du 9 novembre au 27 décembre, sur '+NWEEKS+' semaines.</p>'+
    '<div class="charts" id="cs-charts"></div></section>'+
  '<p class="foot" id="cs-foot"></p>';

/* ---------- Render ---------- */
function renderHeader(){
  var w=isoWeek(S.weekStart);
  q('#cs-week').innerHTML='<strong>Semaine '+w.wk+'</strong><span>'+fmtDate(S.weekStart)+' – '+fmtDate(addDays(S.weekStart,6))+' · semaine '+(Math.round((S.weekStart-FIRST)/6048e5)+1)+' sur '+NWEEKS+'</span>';
  q('#cs-prev').disabled=S.weekStart.getTime()<=FIRST.getTime();
  q('#cs-next').disabled=S.weekStart.getTime()>=LAST.getTime();
}
function renderDays(){
  var isCur=S.weekStart.getTime()===CUR.getTime();
  q('#cs-days').innerHTML=DAYS.map(function(d,i){
    var st=statusIn(S.data,i),date=addDays(S.weekStart,i),today=isCur&&i===TODAY;
    return '<button type="button" class="tab" data-act="tab" data-i="'+i+'" aria-pressed="'+(i===S.sel)+'"'+(today?' aria-current="date"':'')+
      ' style="--c:var(--'+d.c+')" aria-label="'+d.name+' '+date.getDate()+', '+STATUS_LABEL[st]+'">'+
      '<span class="l">'+d.l+'</span><span class="n'+(today?' today':'')+'">'+date.getDate()+'</span>'+
      '<span class="mkw"><span class="mk '+st+'"></span></span></button>';
  }).join('');
}
function renderSummary(){
  var n=0;DAYS.forEach(function(d,i){if(statusIn(S.data,i)==='done')n++;});
  var h=n?('<strong>'+n+'</strong> séance'+(n>1?'s':'')+' terminée'+(n>1?'s':'')+' cette semaine'):'Aucune séance terminée cette semaine';
  var a=avg(S.data.bw),p=avg(prevData().bw);
  if(a!==null){
    h+=' · poids moyen <strong>'+fmtNum(a)+' kg</strong>';
    if(p!==null){var diff=Math.round((a-p)*10)/10;h+=' ('+(diff>0?'+':diff<0?'−':'±')+fmtNum(Math.abs(diff))+' vs sem. passée)';}
  }
  q('#cs-summary').innerHTML=h;
}
function rowHtml(d,id,prev){
  var ex=EX[id],key=d.k+'_'+id,arr=S.data.checks[key]||[],pk=toNum(prev.kg[key]),cur=S.data.kg[key];
  var discs=[0,1,2].map(function(i){
    return '<button type="button" class="set" data-act="set" data-ex="'+id+'" data-i="'+i+'" aria-pressed="'+(arr[i]===true)+'" aria-label="Série '+(i+1)+'">'+(i+1)+'</button>';
  }).join('');
  return '<li class="row'+(setsIn(S.data,d.k,id)===3?' done':'')+'" data-ex="'+id+'">'+
    '<input class="name" id="cs-n-'+d.k+'-'+id+'" data-name="'+id+'" value="'+esc(exName(id))+'" aria-label="Nom de l’exercice" autocomplete="off" enterkeyhint="done">'+
    '<p class="meta">3 × '+ex.reps+' reps · repos '+ex.rest+'</p>'+
    '<div class="ctrl"><div class="sets" role="group" aria-label="Séries faites">'+discs+'</div>'+
    '<label class="kgwrap"><span class="sr">Charge en kilos</span><input class="kgin" id="cs-kg-'+key+'" data-kg="'+key+'" inputmode="decimal" autocomplete="off" placeholder="'+(pk!==null?fmtNum(pk):'0')+'" value="'+esc(cur==null?'':cur)+'"><span>kg</span></label></div>'+
    (pk!==null?'<p class="last">Semaine passée : '+fmtNum(pk)+' kg</p>':'')+
  '</li>';
}
function waterMsg(ml){
  if(ml<=0)return 'Objectif : 2,5 à 3,5 L';
  if(ml<W_MIN)return 'Encore '+fmtL(W_MIN-ml)+' avant 2,5 L';
  if(ml<=W_MAX)return 'Objectif atteint';
  return 'Au-dessus de 3,5 L';
}
function renderPanel(){
  var d=DAYS[S.sel],date=addDays(S.weekStart,S.sel),prev=prevData();
  var total=d.ex.length*3,done=totalIn(S.data,d);
  var h='<section class="card" style="--c:var(--'+d.c+')"><div class="dayhead"><div><p class="eyebrow">'+d.name+' '+fmtDate(date)+'</p><h2>'+d.title+'</h2></div>';
  if(!d.rest)h+='<div class="prog"><div class="pbar"><div class="pfill" id="cs-pfill" style="width:'+(total?done/total*100:0).toFixed(1)+'%"></div></div><span class="pcount" id="cs-pcount">'+done+' / '+total+' séries</span></div>';
  h+='</div>';
  if(d.note)h+='<p class="note">'+d.note+'</p>';
  if(d.rest){
    h+='<p class="restmsg">Repos complet. Sommeil de 7 à 8 h, 8 000 à 10 000 pas et protéines autour de 170 à 180 g.</p>';
  }else{
    h+='<ul class="ex">'+d.ex.map(function(id){return rowHtml(d,id,prev);}).join('')+'</ul>';
    if(d.cardio)h+='<button type="button" class="check" data-act="cardio" aria-pressed="'+cardioIn(S.data,d.k)+'"><span class="box" aria-hidden="true"></span><span><strong>Marche inclinée · 30 min</strong><small>4,5 à 5 km/h · inclinaison 13 à 15 %</small></span></button>';
  }
  h+='</section>';
  var ml=+S.data.water[d.k]||0,bw=S.data.bw[d.k];
  h+='<section class="card" style="--c:var(--blue)"><h3 class="sub">Suivi du jour</h3>'+
    '<div class="bw"><label for="cs-bw-'+d.k+'">Poids du matin</label><div class="kgwrap"><input class="kgin" id="cs-bw-'+d.k+'" data-bw="'+d.k+'" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(bw==null?'':bw)+'"><span>kg</span></div></div>'+
    '<div class="water"><div class="wtop"><div><span class="wl">Eau</span><strong class="wv" id="cs-wv">'+fmtL(ml)+'</strong></div><span class="wg" id="cs-wg">'+waterMsg(ml)+'</span></div>'+
    '<div class="wm" id="cs-wm" role="meter" aria-label="Eau bue aujourd’hui" aria-valuemin="0" aria-valuemax="'+W_MAX+'" aria-valuenow="'+Math.min(ml,W_MAX)+'" aria-valuetext="'+fmtL(ml)+'">'+
    '<div class="wf'+(ml>=W_MIN?' ok':'')+'" id="cs-wf" style="width:'+Math.min(100,ml/W_MAX*100).toFixed(1)+'%"></div><i class="wt"></i></div>'+
    '<div class="wsc" aria-hidden="true"><span style="left:0;transform:none">0</span><span style="left:71.43%">2,5 L</span><span style="left:100%;transform:translateX(-100%)">3,5 L</span></div>'+
    '<div class="wb"><button type="button" data-act="water" data-v="250">+ 250 ml</button><button type="button" data-act="water" data-v="500">+ 500 ml</button><button type="button" data-act="water" data-v="-250" aria-label="Retirer 250 ml">− 250 ml</button></div></div></section>';
  q('#cs-panel').innerHTML=h;
}
function updateWater(d){
  var ml=+S.data.water[d.k]||0;
  q('#cs-wv').textContent=fmtL(ml);q('#cs-wg').textContent=waterMsg(ml);
  var f=q('#cs-wf');f.style.width=Math.min(100,ml/W_MAX*100).toFixed(1)+'%';f.classList.toggle('ok',ml>=W_MIN);
  var m=q('#cs-wm');m.setAttribute('aria-valuenow',String(Math.min(ml,W_MAX)));m.setAttribute('aria-valuetext',fmtL(ml));
}
function refreshLive(){
  var d=DAYS[S.sel],total=d.ex.length*3,done=totalIn(S.data,d);
  root.querySelectorAll('.row').forEach(function(li){li.classList.toggle('done',setsIn(S.data,d.k,li.dataset.ex)===3);});
  var pf=q('#cs-pfill');if(pf)pf.style.width=(total?done/total*100:0).toFixed(1)+'%';
  var pc=q('#cs-pcount');if(pc)pc.textContent=done+' / '+total+' séries';
  renderDays();renderSummary();
}
function renderFoot(){
  q('#cs-foot').textContent=(S.local?'Tes données restent sur cet appareil. ':'Tout s’enregistre automatiquement sur ton compte. ')+
    'Touche le nom d’un exercice pour le remplacer par le tien. Version '+VERSION+'.';
}
function typing(){var a=document.activeElement;return !!(a&&a.tagName==='INPUT'&&q('#cs-panel').contains(a));}
var panelStale=false;
function renderAll(){
  renderHeader();renderDays();renderSummary();
  if(typing())panelStale=true;else{renderPanel();panelStale=false;}
  renderFoot();renderExOptions();renderCharts();
}
/* Re-read state from what the store gave us plus what is still unsent. */
function sync(){
  var d=weekData(S.key),n=namesNow();
  if(stable(d)===stable(S.data)&&stable(n)===stable(S.names))return;
  S.data=d;S.names=n;renderAll();
}

/* ---------- Interaction ---------- */
var lastTap={k:'',t:0};
function dup(k){var n=Date.now();if(lastTap.k===k&&n-lastTap.t<350)return true;lastTap.k=k;lastTap.t=n;return false;}
root.addEventListener('click',function(e){
  if(!alive())return;
  var b=e.target.closest('button[data-act]');if(!b||!root.contains(b)||b.disabled)return;
  var act=b.dataset.act,d=DAYS[S.sel],id=wkId(S.key),p;
  if(dup(act+'|'+(b.dataset.ex||'')+'|'+(b.dataset.i||'')+'|'+(b.dataset.v||'')+'|'+(b.dataset.r||'')+'|'+(b.dataset.id||'')+'|'+S.sel+'|'+S.key))return;
  if(act==='set'){
    var key=d.k+'_'+b.dataset.ex,arr=[0,1,2].map(function(i){return (S.data.checks[key]||[])[i]===true;});
    var i=+b.dataset.i;arr[i]=!arr[i];S.data.checks[key]=arr;
    b.setAttribute('aria-pressed',String(arr[i]));
    p={checks:{}};p.checks[key]=arr;change(id,p);refreshLive();scheduleCharts();
  }else if(act==='cardio'){
    var on=!cardioIn(S.data,d.k);S.data.checks[d.k+'_cardio']=[on];
    b.setAttribute('aria-pressed',String(on));
    p={checks:{}};p.checks[d.k+'_cardio']=[on];change(id,p);refreshLive();
  }else if(act==='water'){
    var nv=Math.max(0,(+S.data.water[d.k]||0)+(+b.dataset.v));S.data.water[d.k]=nv;
    p={water:{}};p.water[d.k]=nv;change(id,p);updateWater(d);
  }else if(act==='tab'){
    S.sel=+b.dataset.i;renderDays();renderPanel();
    var nb=q('.tab[data-i="'+S.sel+'"]');if(nb)nb.focus({preventScroll:true});
  }else if(act==='prev'||act==='next'){
    go(act==='prev'?-1:1);
  }else if(act==='range'){
    UI.range=+b.dataset.r;lsSet('ui',{range:UI.range,ex:UI.ex});renderExOptions();renderCharts();
  }else if(act==='tgl'){
    UI.table[b.dataset.id]=!UI.table[b.dataset.id];renderCharts();
  }
});
root.addEventListener('input',function(e){
  if(!alive())return;
  var t=e.target,id=wkId(S.key),p;
  if(t.dataset.kg){
    S.data.kg[t.dataset.kg]=t.value.trim();p={kg:{}};p.kg[t.dataset.kg]=t.value.trim();change(id,p);scheduleCharts();
  }else if(t.dataset.bw){
    S.data.bw[t.dataset.bw]=t.value.trim();p={bw:{}};p.bw[t.dataset.bw]=t.value.trim();change(id,p);renderSummary();scheduleCharts();
  }else if(t.dataset.name){
    S.names[t.dataset.name]=t.value.trim();p={names:{}};p.names[t.dataset.name]=t.value.trim();change('plan',p);scheduleCharts();
  }
});
root.addEventListener('change',function(e){
  if(!alive())return;
  var t=e.target;
  if(t.dataset.name&&!t.value.trim())t.value=EX[t.dataset.name].n;
  if(t.id==='cs-exsel'&&EX[t.value]){UI.ex=t.value;lsSet('ui',{range:UI.range,ex:UI.ex});renderCharts();}
});
root.addEventListener('focusout',function(){
  if(!alive())return;
  setTimeout(function(){if(alive()&&panelStale&&!typing()){renderPanel();panelStale=false;}},0);
});
function onHide(e){if(alive()&&(document.hidden||(e&&e.type==='pagehide')))flushAll();}
var dayStamp=NOW.toDateString();
function onShow(){                         /* page left open overnight: jump to the new day */
  if(!alive()||document.hidden)return;
  var n=new Date();if(n.toDateString()===dayStamp)return;
  dayStamp=n.toDateString();NOW=n;CUR=mondayOf(n);if(CUR<FIRST)CUR=FIRST;if(CUR>LAST)CUR=LAST;TODAY=(n.getDay()+6)%7;
  flushAll();S.weekStart=CUR;S.sel=TODAY;openWeek();
}
document.addEventListener('visibilitychange',onShow);window.addEventListener('focus',onShow);
stops.push(function(){document.removeEventListener('visibilitychange',onShow);window.removeEventListener('focus',onShow);});
document.addEventListener('visibilitychange',onHide);window.addEventListener('pagehide',onHide);
stops.push(function(){document.removeEventListener('visibilitychange',onHide);window.removeEventListener('pagehide',onHide);});

/* ---------- Weeks ---------- */
var unsub=null,loadTimer=null;
function go(n){
  var next=addDays(S.weekStart,7*n);
  if(next<FIRST||next>LAST)return;
  flushAll();
  S.weekStart=next;
  S.sel=S.weekStart.getTime()===CUR.getTime()?TODAY:0;
  openWeek();
}
function openWeek(){
  if(unsub){try{unsub();}catch(e){}unsub=null;}
  clearTimeout(loadTimer);
  S.key=keyOf(S.weekStart);
  var key=S.key,id=wkId(key);
  S.data=weekData(key);S.names=namesNow();
  renderAll();
  if(S.local){if(!pendingCount())setStatus('');return;}
  if(!REMOTE[id]&&!pendingCount())setStatus('Chargement…');
  loadTimer=setTimeout(function(){
    if(alive()&&key===S.key&&!pendingCount())setStatus('Connexion lente, les données peuvent être en retard');
  },10000);
  unsub=docRef(id).onSnapshot(function(snap){
    if(!alive()||key!==S.key)return;
    if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(loadTimer);var se=q('#cs-save');if(se&&!pendingCount()&&!failing&&se.textContent!=='Enregistré')setStatus('');}
    REMOTE[id]=snap.exists?(snap.data()||{}):{};
    sync();
  },function(){
    if(!alive()||key!==S.key)return;
    clearTimeout(loadTimer);
    if(!pendingCount())setStatus('Données indisponibles pour le moment',true);
  });
}
stops.push(function(){if(unsub){try{unsub();}catch(e){}}clearTimeout(loadTimer);Object.keys(timers).forEach(function(k){clearTimeout(timers[k]);});});

/* ---------- Évolution ---------- */
function allWeeks(){
  var w={};
  Object.keys(REMOTE).concat(Object.keys(PEND)).forEach(function(id){
    if(id.indexOf('w-')===0)w[id.slice(2)]=weekData(id.slice(2));
  });
  w[S.key]=S.data;
  return w;
}
function slots(all){                       /* always the whole programme: 9 Nov to 27 Dec */
  var out=[];
  for(var d=FIRST;d<=LAST;d=addDays(d,7)){
    var key=keyOf(d);
    out.push({key:key,mon:d,wk:isoWeek(d).wk,d:(all[key]&&hasData(all[key]))?all[key]:null});
  }
  return out;
}
function serW(sl){return sl.map(function(s){return s.d?avg(s.d.bw):null;});}
function serSess(sl){
  return sl.map(function(s){
    if(!s.d)return null;var n=0;
    DAYS.forEach(function(d,i){if(statusIn(s.d,i)==='done')n++;});
    return n;
  });
}
function loadRows(sl){                      /* per exercise: first noted load, latest one */
  var rows=[];
  PULL.concat(PUSH,LEGS).forEach(function(id){
    var days=DAYS.filter(function(d){return d.ex.indexOf(id)>=0;}),pts=[];
    sl.forEach(function(s){
      if(!s.d)return;var best=null;
      days.forEach(function(d){var v=toNum(s.d.kg[d.k+'_'+id]);if(v!==null&&(best===null||v>best))best=v;});
      if(best!==null)pts.push({wk:s.wk,v:best});
    });
    if(pts.length)rows.push({id:id,f:pts[0],l:pts[pts.length-1],n:pts.length});
  });
  return rows;
}
function delta(n,unit,good){               /* signed change, with an arrow so colour is never alone */
  var r=Math.round(n*10)/10;
  if(r===0)return '<span class="dl">= stable</span>';
  return '<span class="dl'+(good?(r>0?' up':' down'):'')+'">'+(r>0?'▲ +':'▼ −')+fmtNum(Math.abs(r))+' '+unit+'</span>';
}
var SESS_PER_WEEK=DAYS.filter(function(d){return !d.rest;}).length;
var chartT=null;
function scheduleCharts(){clearTimeout(chartT);chartT=setTimeout(function(){if(alive())renderCharts();},400);}
function renderExOptions(){}
function renderCharts(){
  var host=q('#cs-charts'),sl=slots(allWeeks()),curKey=keyOf(CUR);
  var w=serW(sl),ss=serSess(sl),rows=loadRows(sl);
  var wi=[];w.forEach(function(v,i){if(v!==null)wi.push(i);});
  var elapsed=sl.filter(function(s){return s.mon<=CUR;}).length;
  var done=ss.reduce(function(a,v){return a+(v||0);},0);
  var up=rows.filter(function(r){return r.n>1&&r.l.v>r.f.v;}).length;
  var tracked=rows.filter(function(r){return r.n>1;}).length;

  /* 1. the three numbers that sum it up */
  var wBig='–',wSub='Note ton poids le matin';
  if(wi.length){
    wBig=fmtNum(w[wi[wi.length-1]])+'<small> kg</small>';
    wSub=wi.length>1?delta(w[wi[wi.length-1]]-w[wi[0]],'kg',false)+' depuis S'+sl[wi[0]].wk:'Moyenne de S'+sl[wi[0]].wk;
  }
  var h='<section class="viz"><div class="vh"><div><h3>En résumé</h3><p>Depuis le 9 novembre</p></div></div><div class="stats">'+
    '<div class="stat"><span class="k">Poids</span><b>'+wBig+'</b><span class="s">'+wSub+'</span></div>'+
    '<div class="stat"><span class="k">Séances</span><b>'+done+'</b><span class="s">terminée'+(done>1?'s':'')+' sur '+(elapsed*SESS_PER_WEEK)+' prévues, semaine en cours comprise</span></div>'+
    '<div class="stat"><span class="k">Charges</span><b>'+up+'</b><span class="s">'+(tracked?'exercice'+(up>1?'s':'')+' en hausse sur '+tracked+' suivi'+(tracked>1?'s':''):'Il faut 2 semaines de charges notées')+'</span></div>'+
    '</div></section>';

  /* 2. one line per week */
  h+='<section class="viz"><div class="vh"><div><h3>Semaine par semaine</h3><p>Séances terminées et poids moyen</p></div></div><div class="tw"><table class="wk"><thead><tr><th>Semaine</th><th>Séances</th><th>Poids</th></tr></thead><tbody>';
  var prevW=null;
  sl.forEach(function(s,i){
    var fut=s.mon>CUR,cur=s.key===curKey,n=ss[i]||0,segs='';
    for(var j=0;j<SESS_PER_WEEK;j++)segs+='<i'+(j<n?' class="on"':'')+'></i>';
    h+='<tr class="'+(cur?'cur':fut?'fut':'')+'"><td>S'+s.wk+'<small>'+fmtDate(s.mon)+' – '+fmtDate(addDays(s.mon,6))+'</small></td>';
    if(fut&&!s.d)h+='<td>à venir</td><td>–</td>';
    else{
      h+='<td>'+n+' / '+SESS_PER_WEEK+'<span class="segs" aria-hidden="true">'+segs+'</span></td>';
      if(w[i]===null)h+='<td>–</td>';
      else{h+='<td>'+fmtNum(w[i])+' kg'+(prevW!==null?'<small>'+delta(w[i]-prevW,'kg',false)+'</small>':'')+'</td>';prevW=w[i];}
    }
    h+='</tr>';
  });
  h+='</tbody></table></div></section>';

  /* 3. loads, exercise by exercise */
  h+='<section class="viz"><div class="vh"><div><h3>Charges par exercice</h3><p>Première charge notée, puis la plus récente</p></div></div>';
  if(!rows.length)h+='<p class="empty">Note une charge sous un exercice pour suivre ta progression ici.</p>';
  else{
    h+='<ul class="loads">'+rows.map(function(r){
      var one=r.n===1;
      return '<li><span class="nm">'+esc(exName(r.id))+'</span><span class="vv">'+(one?fmtNum(r.l.v)+' kg':fmtNum(r.f.v)+' → '+fmtNum(r.l.v)+' kg')+'</span>'+
        '<span class="dd">'+(one?'Notée en S'+r.l.wk+'. La comparaison arrive dès la semaine suivante.':delta(r.l.v-r.f.v,'kg',true)+' entre S'+r.f.wk+' et S'+r.l.wk)+'</span></li>';
    }).join('')+'</ul>';
    var missing=PULL.concat(PUSH,LEGS).length-rows.length;
    if(missing)h+='<p class="hint">'+missing+' exercice'+(missing>1?'s':'')+' sans charge notée pour l’instant.</p>';
  }
  h+='</section>';
  host.innerHTML=h;
}
/* ---------- Start ---------- */
async function start(){
  /* Unsent changes from an earlier visit come back first. */
  lsKeys('p:').forEach(function(k){var v=lsGet(k);if(isObj(v))PEND[k.slice(2)]=v;});
  openWeek();                                   /* usable at once, before any network answer */
  var db=null,uid=null;
  try{
    var c=window.claude;
    if(c&&c.use){
      var res=await Promise.race([Promise.all([c.use('db'),c.use('user')]),new Promise(function(r){setTimeout(function(){r(null);},11000);})]);
      if(res&&res[0]&&res[1]){uid=await res[1].id();if(uid)db=res[0];}
    }
  }catch(e){}
  if(!alive())return;
  if(db){
    S.db=db;S.uid=uid;S.local=false;S.ready=true;
    openWeek();
    flushAll();
    try{var ps=await docRef('plan').get();if(alive()){REMOTE.plan=ps.exists?(ps.data()||{}):{};sync();}}catch(e){}
    try{
      var all=await db.collection('data/users/'+uid).get();
      if(alive()){
        all.docs.forEach(function(doc){if(doc.id.indexOf('w-')===0&&!REMOTE[doc.id])REMOTE[doc.id]=doc.data()||{};});
        renderSummary();if(!typing())renderPanel();renderCharts();
      }
    }catch(e){}
  }else{
    lsKeys('d:').forEach(function(k){var v=lsGet(k);if(isObj(v))REMOTE[k.slice(2)]=v;});
    S.ready=true;sync();renderFoot();
    flushAll();
  }
}
start();
})();
</script>
</body>
